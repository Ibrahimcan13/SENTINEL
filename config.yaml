data:
  default_ticker: "RACE"

analysis:
  window_size: 20
  rsi_window: 14
  atr_window: 14
  use_kalman: true

machine_learning:
  model_type: "random_forest"  
  train_window: 200
  forecast_days: 5
  retrain_step: 20
  hyperparameters:
    n_estimators: 100
    max_depth: 4
    min_samples_leaf: 10
    max_features: "sqrt"
    class_weight: "balanced"
    random_state: 42

strategy:
  ai_upper_threshold: 0.55
  ai_lower_threshold: 0.45
  allow_short: true
  confirmation_days: 1

backtest:
  initial_capital: 1000.0
  risk_per_trade: 0.02
  commission_rate: 0.001
  slippage_rate: 0.0005
  use_atr_stop: true
  atr_multiplier: 2.0
  ai_exit_threshold: 0.50